version: 2

models:
  - name: stg_stripe__payment
    description: One row per source payment record, including successful and failed attempts. Source amounts in cents are converted to US dollars with two decimal places.
    columns:
      - name: amount_usd
        data_type: number
        description: Source amount divided by 100 and cast to numeric(16, 2) by cents_to_dollars. Only successful payments contribute to fct_orders.amount_usd.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: created
        data_type: date
        description: Source payment creation date, retained separately from the order date.
        data_tests:
          - not_null
      - name: payment_id
        data_type: number
        description: Source payment identifier, renamed from id; identifies an individual payment record rather than an order.
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_type: number
        description: Order associated with the payment, renamed from orderid. Multiple payment records can belong to the same order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__orders')
                field: order_id
      - name: payment_method
        data_type: varchar
        description: Source payment tender category, such as credit_card or gift_card; retained without normalization.
        data_tests:
          - accepted_values:
              arguments:
                values: [gift_card, credit_card, coupon, bank_transfer]
      - name: status
        data_type: varchar
        description: Payment outcome from the source. Only success is included when calculating order payment amounts; fail records remain in staging.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [success, fail]
      - name: _batched_at
        data_type: timestamp_ltz
        description: Source batch ingestion timestamp, distinct from the payment creation date.
