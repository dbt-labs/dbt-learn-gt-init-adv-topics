version: 2

models:
  - name: stg_jaffle_shop__customers
    description: One row per Jaffle Shop customer, with source identifiers renamed for downstream joins.
    columns:
      - name: customer_id
        data_type: number
        description: Customer identifier from the source id; joins customers to their orders.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        description: Customer's given name as recorded in Jaffle Shop; personal information.
      - name: last_name
        data_type: varchar
        description: Customer's family name as recorded in Jaffle Shop; personal information.

  - name: stg_jaffle_shop__orders
    description: One row per Jaffle Shop order, retaining its source status and ingestion timestamp.
    columns:
      - name: order_id
        data_type: number
        description: Order identifier from the source id; joins orders to payment records.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: number
        description: Customer who placed the order, renamed from source user_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        data_type: date
        description: Date the order was placed, passed through from Jaffle Shop.
      - name: status
        data_type: varchar
        description: Source order lifecycle status, including completed, placed, shipped, return_pending, and returned.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "returned"
                  - "completed"
                  - "return_pending"
                  - "placed"
                  - "shipped"
      - name: _etl_loaded_at
        data_type: timestamp_ntz
        description: Timestamp when the source order was loaded by ETL; used by source freshness checks.

  - name: stg_jaffle_shop__products
    description: One row per Jaffle Shop product SKU, retaining the source catalog attributes and unconverted price.
    columns:
      - name: sku
        data_type: varchar
        description: Stock-keeping unit identifying a product in the source catalog.
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_type: varchar
        description: Display name of the catalog product, renamed from source name.
      - name: product_type
        data_type: varchar
        description: Source catalog classification of the product; no remapping is applied.
      - name: description
        data_type: varchar
        description: Free-text product description supplied by the source catalog.
      - name: price
        data_type: number
        description: Product price passed through without currency or unit conversion; source units are not defined in this project.
