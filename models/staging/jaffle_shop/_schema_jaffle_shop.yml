version: 2

models:
  - name: stg_jaffle_shop__customers
    description: One row per source customer, with identifiers and names used to join orders and build the customer dimension. Includes customers who have never ordered.
    columns:
      - name: customer_id
        data_type: number
        description: Source customer identifier, renamed from id; the join key for orders and customer-level reporting.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        description: Customer's first name as recorded in the source, without normalization.
      - name: last_name
        data_type: varchar
        description: Customer's last name as recorded in the source, without normalization.

  - name: stg_jaffle_shop__orders
    description: One row per source order, including its customer, order date, lifecycle status, and ingestion timestamp. No order statuses are filtered out.
    config: 
      event_time: order_date
    columns:
      - name: order_id
        data_type: number
        description: Source order identifier, renamed from id; the join key for payment aggregation.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: number
        description: Customer who placed the order, renamed from user_id; references the customer staging model.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        data_type: date
        description: Source order date used to derive customers' first and most recent order dates.
        data_tests:
          - not_null
      - name: status
        data_type: varchar
        description: Source order lifecycle status. Returned and return-pending orders remain available for downstream reporting.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - returned
                  - completed
                  - return_pending
                  - placed
                  - shipped
      - name: _etl_loaded_at
        data_type: timestamp_ntz
        description: Source ingestion timestamp used by the orders source freshness check; not the date the order was placed.

  - name: stg_jaffle_shop__products
    description: One row per product SKU, with catalog attributes and the unmodified source price. Prices are not converted to dollars by this model.
    columns:
      - name: sku
        data_type: varchar
        description: Source stock-keeping unit identifying a product in the catalog.
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_type: varchar
        description: Product's display name, renamed from the source name field.
        data_tests:
          - not_null
      - name: product_type
        data_type: varchar
        description: Source catalog category distinguishing jaffles from beverages.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [jaffle, beverage]
      - name: description
        data_type: varchar
        description: Free-text product description supplied by the source catalog; retained without transformation.
      - name: price
        data_type: number
        description: Catalog price in its original source units. Currency and minor-unit convention are not established in this project's SQL; do not directly combine with amount_usd.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
