version: 2

models:
  - name: stg_jaffle_shop__customers
    config:
      group: marketing
    description: One row per customer from Jaffle Shop, with the source id renamed for joins to orders.
    columns:
      - name: customer_id
        data_type: number
        description: Customer identifier from the source id; the primary key used to associate orders with customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        description: Customer's given name as recorded in Jaffle Shop.
      - name: last_name
        data_type: varchar
        description: Customer's family name as recorded in Jaffle Shop; may be abbreviated by the source.

  - name: stg_jaffle_shop__orders
    config:
      group: marketing
      event_time: order_date
    description: One row per Jaffle Shop order, retaining its customer, order status, and ingestion timestamp.
    columns:
      - name: order_id
        data_type: number
        description: Order identifier from the source id; the primary key used to join orders to payments.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: number
        description: Customer who placed the order, renamed from the source user_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        data_type: date
        description: Date the order was placed, as recorded by Jaffle Shop.
        data_tests:
          - not_null
      - name: order_status
        data_type: varchar
        description: Order lifecycle status; retained for all orders, including returned orders.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "returned"
                  - "completed"
                  - "return_pending"
                  - "placed"
                  - "shipped"
      - name: _etl_loaded_at
        data_type: timestamp_ntz
        description: Source ingestion timestamp used to assess how recently order data was loaded; not the order placement time.
        data_tests:
          - not_null

  - name: stg_jaffle_shop__products
    config:
      group: marketing
    description: One row per product SKU in the Jaffle Shop catalog; source prices are passed through without currency conversion.
    columns:
      - name: sku
        data_type: varchar
        description: Stock-keeping unit identifying a product in the catalog; the model's primary key.
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_type: varchar
        description: Product's display name in the source catalog.
        data_tests:
          - not_null
      - name: product_type
        data_type: varchar
        description: Catalog category distinguishing jaffles from beverages.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['jaffle', 'beverage']
      - name: description
        data_type: varchar
        description: Free-text product description supplied by the source catalog.
      - name: price
        data_type: number
        description: Catalog price copied unchanged from the source; currency and monetary scale are not specified by this model.
        data_tests:
          - not_null
