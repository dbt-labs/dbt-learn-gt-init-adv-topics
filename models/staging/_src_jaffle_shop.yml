version: 2

sources:
  - name: jaffle_shop
    description: tables in the jaffle_shop schema with raw business data
    database: raw
    tables:
      - name: customers
        description: raw customers tables with names and ids
        columns:
          - name: id
            description: unique customer id 
            data_type: number
            data_tests:
              - unique
              - not_null
          - name: first_name
            data_type: varchar
          - name: last_name
            data_type: varchar
      - name: customers_test
      - name: orders
        columns:
          - name: id
            data_type: number
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_type: number
          - name: order_date
            data_type: date
          - name: status
            data_type: varchar
          - name: _etl_loaded_at
            data_type: timestamp_ltz
        config: 
          freshness:
            warn_after:
              count: 1
              period: day
            error_after:
              count: 2
              period: day
          loaded_at_field: _etl_loaded_at
      - name: orders_view
      - name: products