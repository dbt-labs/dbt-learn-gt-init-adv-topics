version: 2

models:
  - name: stg_jaffle_shop__customers
    description: >
      Cleaned customer records from the Jaffle Shop application, with one row
      per customer. Renames the source customer key for consistent downstream
      use while preserving the source-provided name fields.
    columns:
      - name: customer_id
        description: Unique identifier for the customer, renamed from the source `id` field.

      - name: first_name
        description: Customer's first name as recorded in the Jaffle Shop application.

      - name: last_name
        description: Customer's last name as recorded in the Jaffle Shop application.

  - name: stg_jaffle_shop__orders
    description: >
      Cleaned order records from the Jaffle Shop application, with one row per
      order. Standardizes customer and order identifiers and retains the source
      order status and load timestamp for downstream analysis.
    columns:
      - name: order_id
        description: Unique identifier for the order, renamed from the source `id` field.

      - name: customer_id
        description: Identifier of the customer who placed the order, renamed from the source `user_id` field.

      - name: order_date
        description: Date the order was placed in the Jaffle Shop application.

      - name: order_status
        description: Current source-reported status of the order, renamed from the source `status` field.

      - name: _etl_loaded_at
        description: Timestamp when the source order record was loaded by the ETL process.
