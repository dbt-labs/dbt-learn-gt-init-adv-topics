version: 2

models:
  - name: customer_orders
    description: >
      Customer-level order summary with one row per customer who has placed at
      least one order. Provides lifetime order dates and counts for reuse in
      customer-facing marts; customers without orders are intentionally absent.
    columns:
      - name: customer_id
        description: Unique identifier for a customer with at least one order.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: first_order_date
        description: Earliest order date recorded for the customer.
        data_tests:
          - date_compare:
              arguments:
                date2: most_recent_order_date

      - name: most_recent_order_date
        description: Latest order date recorded for the customer.

      - name: number_of_orders
        description: Total number of orders recorded for the customer.
        data_tests:
          - not_null
