version: 2


models:
  - name: stg_jaffle_shop__customers
    description: >-
      Standardized customer records from the Jaffle Shop customers source, with
      source identifiers renamed for consistent downstream joins. One row per customer.
    columns:
      - name: customer_id
        description: Primary identifier for the customer, renamed from the source `id` column.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name as provided by the source system.
      - name: last_name
        description: Customer's last name as provided by the source system.

  - name: stg_jaffle_shop__orders
    description: >-
      Standardized order records from the Jaffle Shop orders source, with order
      and customer identifiers renamed for consistent downstream joins. One row per order.
    columns:
      - name: order_id
        description: Primary identifier for the order, renamed from the source `id` column.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: >-
          Identifier for the customer who placed the order, renamed from the source
          `user_id` column and used to join to `stg_jaffle_shop__customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date associated with the order as provided by the source system.
        data_tests:
          - not_null
      - name: status
        description: Current order lifecycle status as provided by the source system.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - placed
                  - return_pending
                  - returned
                  - shipped
      - name: _etl_loaded_at
        description: Timestamp when the order record was loaded by the upstream ETL process.
        data_tests:
          - not_null
