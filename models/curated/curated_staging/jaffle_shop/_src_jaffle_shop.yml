version: 2

sources:
  - name: jaffle_shop
    description: All of our source data for our jaffle shop (sandwiches)
    database: raw
    tables:
      - name: customer_web_activity
      - name: customers
        columns: 
          - name: id
            data_tests:
              - unique
              - not_null
      - name: items
      - name: locations
      - name: order_items
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_tests:
              - not_null
      - name: products
      - name: raw_customers
      - name: raw_items
      - name: raw_orders
      - name: raw_products
      - name: raw_stores
      - name: raw_supplies
      - name: stores
      - name: supplies