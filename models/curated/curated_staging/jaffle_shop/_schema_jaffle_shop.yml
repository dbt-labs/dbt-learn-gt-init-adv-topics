version: 2

models:
  - name: stg_jaffle_shop__customers
    description: >
      Cleaned customer records from the Jaffle Shop source, with the source identifier
      renamed for consistent downstream use. One row per customer.
    columns:
      - name: customer_id
        description: Unique customer identifier, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's given name as recorded in the source system.

      - name: last_name
        description: Customer's family name as recorded in the source system.

  - name: stg_jaffle_shop__orders
    description: >
      Cleaned order records from the Jaffle Shop source, with source identifiers renamed
      for consistent downstream use. One row per order.
    columns:
      - name: order_id
        description: Unique order identifier, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer who placed the order, renamed from the source `user_id` field.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        description: Calendar date on which the order was placed.
        data_tests:
          - not_null

      - name: status
        description: Current operational state of the order in the source system.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - completed
                  - placed
                  - return_pending
                  - returned
                  - shipped

      - name: _etl_loaded_at
        description: Timestamp when the source order record was loaded by the ingestion process.
