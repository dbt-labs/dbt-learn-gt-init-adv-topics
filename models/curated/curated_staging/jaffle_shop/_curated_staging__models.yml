version: 2

models:
  - name: stg_jaffle_shop_customers
    description: >-
      Customer records standardized from the Jaffle Shop source for use by
      downstream models. Each row represents one customer.
    columns:
      - name: customer_id
        description: Primary key for the customer, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer's first name as provided by the source system.

      - name: last_name
        description: Customer's last name as provided by the source system.

  - name: stg_jaffle_shop_orders
    description: >-
      Order records standardized from the Jaffle Shop source for use by
      downstream models. Each row represents one order placed by a customer.
    columns:
      - name: order_id
        description: Primary key for the order, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer who placed the order, renamed from the source `user_id` field.
        data_tests:
          - not_null

      - name: order_date
        description: Calendar date on which the order was placed.

      - name: status
        description: Current order lifecycle status reported by the source system.

