version: 2

sources:
  - name: jaffle_shop
    description: All of our source data for our Jaffle shop (sandwidches)
    database: raw
    tables:
      - name: customer_web_activity
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique:
                  description: >
                    Ensures each source customer identifier occurs once. Duplicates
                    would create multiple staging rows for the same customer.
              - not_null:
                  description: >
                    Ensures every source customer can be identified and joined to
                    downstream customer records.
      - name: items
      - name: locations
      - name: order_items
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique:
                  description: >
                    Ensures each source order identifier occurs once. Duplicates
                    would overstate order counts in downstream models.
              - not_null:
                  description: >
                    Ensures every source order has an identifier that can be used as
                    its primary key.
          - name: user_id
            data_tests:
              - not_null:
                  description: >
                    Ensures every source order is associated with a customer before
                    the identifier is renamed in staging.
      - name: products
      - name: raw_customers
      - name: raw_items
      - name: raw_orders
      - name: raw_products
      - name: raw_stores
      - name: raw_supplies
      - name: stores
      - name: supplies
