models:
- name: fct_orders
  config:
   group: marketing
   access: protected

- name: fct_orders_dynamic
  config:
   group: marketing
   access: protected

- name: dim_customers
  latest_version: 2
  config:
   group: marketing
   access: public
   contract:
     enforced: true
  columns:
    - name: customer_id
      data_type: number
      constraints:
        - type: not_null
    
    - name: first_name
      data_type: varchar


    - name: last_name
      data_type: varchar


    - name: first_order_date
      data_type: date


    - name: most_recent_order_date
      data_type: date


    - name: number_of_orders
      data_type: number


    - name: lifetime_value
      data_type: number


  versions:
   - v: 1
   - v: 2
     config:
       alias: dim_customers

     columns:
       - name: customer_lifetime_value
         data_type: number
       - include: all
         exclude: [lifetime_value]
