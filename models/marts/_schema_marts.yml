version: 2

models:
  - name: fct_orders
    description: >-
      One row per Jaffle Shop order, including orders in every lifecycle status.
      Left joins the sum of successful Stripe payments by order. Orders without
      a non-null successful payment amount receive an amount_usd of zero.
    columns:
      - name: order_id
        data_type: number
        description: Order identifier from stg_jaffle_shop__orders; primary key after payment aggregation and the left join.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: number
        description: Customer who placed the order; joins to the customer staging model and dim_customers.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        data_type: date
        description: Original order date from stg_jaffle_shop__orders; not the payment creation date.
      - name: amount_usd
        data_type: number
        description: Sum of amount_usd for payments with status success, coalesced to zero; no adjustment based on the order lifecycle status is applied.
        data_tests:
          - not_null

  - name: dim_customers
    description: >-
      One row per customer, including customers without orders. Summarizes all
      fct_orders records by customer, without filtering order status. Customers
      without orders have number_of_orders = 0 and null order dates and lifetime_value.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              (number_of_orders = 0 and first_order_date is null
              and most_recent_order_date is null and lifetime_value is null)
              or (number_of_orders > 0 and first_order_date is not null
              and most_recent_order_date is not null and lifetime_value is not null
              and first_order_date <= most_recent_order_date)
    columns:
      - name: customer_id
        data_type: number
        description: Customer identifier from stg_jaffle_shop__customers; primary key after joining customer-level order aggregates.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        description: Customer given name passed through from stg_jaffle_shop__customers.
      - name: last_name
        data_type: varchar
        description: Customer family name passed through from stg_jaffle_shop__customers.
      - name: first_order_date
        data_type: date
        description: Earliest order_date across all of the customer's orders; null when the customer has no orders.
      - name: most_recent_order_date
        data_type: date
        description: Latest order_date across all of the customer's orders; null when the customer has no orders.
      - name: number_of_orders
        data_type: number
        description: Count of order_id across all of the customer's orders, including returned orders; zero when no orders exist.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lifetime_value
        data_type: number
        description: Sum of fct_orders.amount_usd across the customer's orders, in USD; null for customers without orders and zero for orders with no successful payments.

  - name: fct_page_views
    description: >-
      One row per Snowplow event whose event value is page_view. Left joins
      activity aggregated from all events sharing page_view_id. Multiple page_view
      events with the same page_view_id remain separate rows. Activity estimates
      count all event types, and are not measured elapsed durations. Tagged nightly.
    columns:
      - name: page_view_id
        data_type: varchar
        description: Source page-view grouping identifier used to join all-event activity aggregates; not assumed to be unique in this model.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_snowplow__events')
                field: page_view_id
      - name: event_id
        data_type: varchar
        description: Identifier of the retained page_view event; primary key at the model's event grain.
        data_tests:
          - unique
          - not_null
      - name: anonymous_user_id
        data_type: varchar
        description: Anonymous visitor identifier from the base page_view event; not a Jaffle Shop customer identifier.
      - name: session_id
        data_type: varchar
        description: Browsing-session identifier from the base page_view event.
      - name: event
        data_type: varchar
        description: Source event name, restricted by the model filter to page_view.
        data_tests:
          - accepted_values:
              arguments:
                values: ['page_view']
      - name: device_type
        data_type: varchar
        description: Device classification from the base page_view event.
      - name: page_url
        data_type: varchar
        description: Full page URL from the base page_view event.
      - name: page_title
        data_type: varchar
        description: Page title captured on the base page_view event.
      - name: page_urlscheme
        data_type: varchar
        description: Parsed URL scheme from the base page_view event.
      - name: page_urlhost
        data_type: varchar
        description: Parsed URL hostname from the base page_view event.
      - name: page_urlport
        data_type: number
        description: Parsed URL port from the base page_view event; may be absent when no port is specified.
      - name: page_urlpath
        data_type: varchar
        description: Parsed URL path from the base page_view event.
      - name: page_urlquery
        data_type: varchar
        description: Parsed URL query string from the base page_view event; may be absent when there is no query string.
      - name: page_urlfragment
        data_type: varchar
        description: Parsed URL fragment from the base page_view event; may be absent when there is no fragment.
      - name: collector_tstamp
        data_type: timestamp_ntz
        description: Collector timestamp for the base page_view event, distinct from the latest collector timestamp across its associated events.
      - name: derived_tstamp
        data_type: timestamp_ntz
        description: Derived timestamp for the base page_view event, distinct from the earliest timestamp across its associated events.
      - name: approx_time_on_page
        data_type: number
        description: Count of all events sharing page_view_id multiplied by 10; a rough duration estimate, not elapsed time. Null when page_view_id is null and the aggregate cannot join.
        data_tests:
          - not_null:
              config:
                where: page_view_id is not null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
      - name: page_view_start
        data_type: timestamp_ntz
        description: Minimum derived_tstamp across all events sharing page_view_id; null when no aggregate joins or all associated timestamps are null.
      - name: max_collector_tstamp
        data_type: timestamp_ntz
        description: Maximum collector_tstamp across all events sharing page_view_id; null when no aggregate joins or all associated timestamps are null.
