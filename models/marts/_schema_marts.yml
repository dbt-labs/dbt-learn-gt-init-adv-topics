version: 2

models:
  - name: fct_orders
    description: One row per order, across all order statuses, enriched with the sum of successful payment amounts in US dollars. Orders without successful payments have amount_usd equal to zero; this is not net revenue after returns.
    columns:
      - name: order_id
        data_type: number
        description: Order-grain primary key inherited from the order staging model.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: number
        description: Customer who placed the order; joins to the customer staging model and customer dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        data_type: date
        description: Source order date, used for customer order-history aggregation regardless of order status.
      - name: amount_usd
        data_type: number
        description: Sum of amount_usd for payments whose status is success, grouped by order_id. Defaults to zero when no successful payment amount is available; returned orders are not excluded.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_customers
    description: One row per source customer, including customers with no orders, enriched with order-history dates, order count, and successful-payment lifetime value. Order history includes every order status.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(number_of_orders = 0 and first_order_date is null and most_recent_order_date is null and lifetime_value is null) or (number_of_orders > 0 and first_order_date is not null and most_recent_order_date is not null and lifetime_value is not null and first_order_date <= most_recent_order_date)"
    columns:
      - name: customer_id
        data_type: number
        description: Customer-grain primary key from the customer staging model; customers remain present even without order history.
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_type: varchar
        description: Customer's first name passed through from the customer staging model without normalization.
      - name: last_name
        data_type: varchar
        description: Customer's last name passed through from the customer staging model without normalization.
      - name: first_order_date
        data_type: date
        description: Earliest order_date across all of the customer's orders, including returned orders. Null when the customer has no orders.
      - name: most_recent_order_date
        data_type: date
        description: Latest order_date across all of the customer's orders, including returned orders. Null when the customer has no orders.
      - name: number_of_orders
        data_type: number
        description: Count of order identifiers for the customer across all statuses, defaulting to zero when no orders exist.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lifetime_value
        data_type: number
        description: Sum of order-level successful payment amounts in US dollars across all order statuses. Null for customers with no orders; zero is possible for customers whose orders have no successful payments. Not adjusted for refunds.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_page_views
    description: One row per source event whose event type is page_view, enriched with activity aggregates across all events sharing page_view_id. The model does not deduplicate page_view_id; event_id defines the row grain. Null page_view_id values do not match the activity aggregate.
    columns:
      - name: page_view_id
        data_type: varchar
        description: Context identifier used to attach page-level activity aggregates to the page_view event. Uniqueness is not enforced by the model.
      - name: event_id
        data_type: varchar
        description: Identifier of the retained page_view event; the row-grain key of this mart.
        data_tests:
          - unique
          - not_null
      - name: anonymous_user_id
        data_type: varchar
        description: Anonymous visitor identifier from the page_view event; not linked to commerce customer_id in this project.
      - name: session_id
        data_type: varchar
        description: Tracker session identifier from the page_view event.
      - name: event
        data_type: varchar
        description: Event type, restricted by this model to page_view.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [page_view]
      - name: device_type
        data_type: varchar
        description: Device category reported on the retained page_view event.
      - name: page_url
        data_type: varchar
        description: Full URL reported on the page_view event, including any query parameters and fragment.
      - name: page_title
        data_type: varchar
        description: Page title reported on the retained page_view event.
      - name: page_urlscheme
        data_type: varchar
        description: Source-parsed URL scheme from the page_view event.
      - name: page_urlhost
        data_type: varchar
        description: Source-parsed URL host from the page_view event.
      - name: page_urlport
        data_type: number
        description: Source-parsed URL port from the page_view event; may be absent when no explicit port is provided.
      - name: page_urlpath
        data_type: varchar
        description: Source-parsed URL path from the page_view event, excluding query parameters and fragment.
      - name: page_urlquery
        data_type: varchar
        description: Source-parsed query component from the page_view event; may be absent when the URL has no query string.
      - name: page_urlfragment
        data_type: varchar
        description: Source-parsed fragment from the page_view event; may be absent when the URL has no fragment.
      - name: collector_tstamp
        data_type: timestamp_ntz
        description: Collector timestamp of this page_view event, distinct from the latest collector timestamp across associated events.
      - name: derived_tstamp
        data_type: timestamp_ntz
        description: Source-derived timestamp of this page_view event, distinct from the earliest timestamp across associated events.
      - name: approx_time_on_page
        data_type: number
        description: Approximate seconds on page, calculated as count(*) times 10 across all events with the same page_view_id, including the page_view event itself. This assumes ten seconds per event, not measured elapsed time. Null when page_view_id does not join.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 10
      - name: page_view_start
        data_type: timestamp_ntz
        description: Minimum derived_tstamp across all events sharing page_view_id, not necessarily the timestamp of the retained page_view event. Null when the aggregate does not join or has no derived timestamps.
      - name: max_collector_tstamp
        data_type: timestamp_ntz
        description: Maximum collector_tstamp across all events sharing page_view_id. Null when the aggregate does not join or has no collector timestamps.
